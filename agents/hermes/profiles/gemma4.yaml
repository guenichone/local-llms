model:
  default: /home/barrak/models/gemma4-4b/gemma-4-E4B-it-Q4_K_M.gguf
  provider: custom
  api_key: not-needed
  base_url: http://127.0.0.1:8084/v1
  context_length: 32768
  max_tokens: 4096
agent:
  max_turns: 200
  coding_instructions:
    - Run lint/typecheck before finishing code changes.
    - Keep diffs clean — no debug prints or commented-out code.
    - If a tool call fails, read the error carefully and don't repeat the same mistake.
      If you fail 3 times in a row on the same task, stop and tell the user you're
      stuck.
  verbose: false
  reasoning_effort: none
  personalities:
    technical: You are a technical expert. Provide detailed, accurate technical information.
    concise: You are a concise assistant. Keep responses brief and to the point.
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.15
  protect_last_n: 25
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
auxiliary:
  web_extract:
    provider: main
  session_search:
    provider: main
display:
  compact: false
  busy_input_mode: queue
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: dos
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
dashboard:
  theme: dos
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 15
approvals:
  destructive_slash_confirm: false
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: true
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - web
    - terminal
    - file
    - skills
    - todo
    - cronjob
    - delegation
    - memory
    - session_search
    - code_execution
skin: dos
plugins:
  enabled:
    - web/ddgs
  disabled:
    - web/firecrawl
web:
  provider: serpapi
  extract_backend: tavily
